<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Atelier Market</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            padding: clamp(24px, 5vw, 42px);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            font-family: "Fraunces", Georgia, serif;
            font-size: 1.8rem;
            margin: 0 0 8px;
            color: var(--ink);
        }

        .auth-header p {
            margin: 0;
            color: rgba(28, 26, 23, 0.72);
            font-size: 0.95rem;
        }

        .auth-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(231, 216, 199, 0.3);
            padding: 4px;
            border-radius: 999px;
        }

        .auth-tab {
            border: none;
            background: transparent;
            color: rgba(28, 26, 23, 0.65);
            padding: 10px 14px;
            border-radius: 999px;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s ease;
        }

        .auth-tab.active {
            background: #fff;
            color: var(--ink);
            box-shadow: 0 2px 6px rgba(28, 26, 23, 0.1);
        }

        .auth-form {
            display: none;
            animation: fadeIn 0.3s ease forwards;
        }

        .auth-form.active {
            display: grid;
            gap: 14px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            display: grid;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--ink);
        }

        .form-group input {
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            font: inherit;
            font-size: 0.95rem;
            background: #fff;
            transition: 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--ink);
            box-shadow: 0 0 0 3px rgba(28, 26, 23, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(28, 26, 23, 0.5);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--ink);
        }

        .checkbox-group label {
            cursor: pointer;
            flex: 1;
            margin: 0;
        }

        .forgot-pwd {
            text-decoration: none;
            color: var(--teal);
            font-weight: 600;
            font-size: 0.88rem;
            transition: 0.2s ease;
        }

        .forgot-pwd:hover {
            color: var(--ink);
        }

        .auth-submit {
            border: none;
            background: var(--ink);
            color: #fff;
            padding: 12px 18px;
            border-radius: 999px;
            font: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s ease;
            margin-top: 6px;
        }

        .auth-submit:hover {
            transform: translateY(-1px);
        }

        .auth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            font-size: 0.85rem;
            color: rgba(28, 26, 23, 0.5);
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .auth-social {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .auth-social button {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font: inherit;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .auth-social button:hover {
            border-color: var(--ink);
            background: #f9f7f4;
        }

        .error-msg {
            background: rgba(212, 48, 48, 0.1);
            border: 1px solid rgba(212, 48, 48, 0.3);
            color: #c23030;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            display: none;
        }

        .error-msg.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-msg {
            background: rgba(34, 139, 34, 0.1);
            border: 1px solid rgba(34, 139, 34, 0.3);
            color: #2a8a2a;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            display: none;
        }

        .success-msg.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
        }

        .back-link a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.2s ease;
        }

        .back-link a:hover {
            color: var(--ink);
        }

        @media (max-width: 520px) {
            .auth-card {
                padding: 20px;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }

            .form-group input {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="grain"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Atelier Market</h1>
                <p>Sign in to your account</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab" type="button">Sign In</button>
                <button class="auth-tab" id="signupTab" type="button">Create Account</button>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        name="email" 
                        placeholder="you@example.com" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">Remember me</label>
                </div>

                <div style="text-align: right;">
                    <a href="#" class="forgot-pwd" onclick="alert('Password reset coming soon'); return false;">Forgot password?</a>
                </div>

                <button type="submit" class="auth-submit">Sign In</button>
            </form>

            <!-- Signup Form -->
            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input 
                        type="text" 
                        id="signupName" 
                        name="name" 
                        placeholder="John Doe" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input 
                        type="email" 
                        id="signupEmail" 
                        name="email" 
                        placeholder="you@example.com" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input 
                        type="password" 
                        id="signupPassword" 
                        name="password" 
                        placeholder="At least 8 characters" 
                        required
                        minlength="8"
                    >
                </div>

                <div class="form-group">
                    <label for="signupPasswordConfirm">Confirm Password</label>
                    <input 
                        type="password" 
                        id="signupPasswordConfirm" 
                        name="passwordConfirm" 
                        placeholder="Confirm your password" 
                        required
                    >
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="agreeTerms" name="agreeTerms" required>
                    <label for="agreeTerms">I agree to the terms and privacy policy</label>
                </div>

                <button type="submit" class="auth-submit">Create Account</button>
            </form>

            <div class="auth-divider">or</div>

            <div class="auth-social">
                <button type="button" onclick="alert('Google sign-in coming soon')">Google</button>
                <button type="button" onclick="alert('Apple sign-in coming soon')">Apple</button>
            </div>

            <div class="back-link">
                <a href="index.html">← Back to Store</a>
            </div>
        </div>
    </div>

    <script>
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const API_BASE = window.location.hostname === "localhost" 
            ? "http://localhost:5501"
            : "";

        function apiUrl(path) {
            return `${API_BASE}${path}`;
        }

        async function parseJsonResponse(res) {
            const text = await res.text();
            try {
                return text ? JSON.parse(text) : {};
            } catch {
                throw new Error(`Expected JSON but received: ${text.slice(0, 80)}`);
            }
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('show');
            successMsg.classList.remove('show');
            setTimeout(() => errorMsg.classList.remove('show'), 4000);
        }

        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.classList.add('show');
            errorMsg.classList.remove('show');
            setTimeout(() => successMsg.classList.remove('show'), 4000);
        }

        // Tab switching
        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginForm.classList.add('active');
            signupForm.classList.remove('active');
        });

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupForm.classList.add('active');
            loginForm.classList.remove('active');
        });

        // Login form handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Please fill in all fields.');
                return;
            }

            try {
                const res = await fetch(apiUrl('/api/auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await parseJsonResponse(res);

                if (!res.ok) {
                    showError(data.error || 'Login failed');
                    return;
                }

                showSuccess(`Welcome back, ${data.user.name}!`);
                localStorage.setItem('user', JSON.stringify(data.user));
                setTimeout(() => window.location.href = 'index.html', 1500);
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        });

        // Signup form handler
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;

            if (!name || !email || !password || !passwordConfirm) {
                showError('Please fill in all fields.');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }

            if (password !== passwordConfirm) {
                showError('Passwords do not match.');
                return;
            }

            if (!agreeTerms) {
                showError('Please agree to the terms and privacy policy.');
                return;
            }

            try {
                const res = await fetch(apiUrl('/api/auth/signup'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await parseJsonResponse(res);

                if (!res.ok) {
                    showError(data.error || 'Signup failed');
                    return;
                }

                showSuccess(`Account created! Redirecting...`);
                setTimeout(() => window.location.href = 'auth.html?tab=login', 1500);
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        });

        // Restore "Remember me" state if previously checked
        window.addEventListener('load', () => {
            const rememberMe = localStorage.getItem('rememberMe');
            if (rememberMe === 'true') {
                document.getElementById('rememberMe').checked = true;
                document.getElementById('loginEmail').value = localStorage.getItem('userEmail') || '';
            }
        });

        // Save "Remember me" state
        document.getElementById('rememberMe').addEventListener('change', (e) => {
            if (e.target.checked) {
                localStorage.setItem('rememberMe', 'true');
                localStorage.setItem('userEmail', document.getElementById('loginEmail').value);
            } else {
                localStorage.removeItem('rememberMe');
                localStorage.removeItem('userEmail');
            }
        });
    </script>
</body>
</html>
